name: 인스타 예약 시계

# insta.yml 의 schedule 이 2026-09-14 워크플로 개편 뒤 몇 시간째 안 울려(다른 워크플로 예약은 정상) 별도 "시계" 워크플로가 대신 누른다.
# 하는 일: 정해진 시각에 insta.yml 을 workflow_dispatch 로 실행(계정 전부). insta.yml 자체 schedule 이 다시 울려도 concurrency 로 겹치지 않는다.
on:
  schedule:
    - cron: "32 21 * * *"   # 06:32 KST 후보
    - cron: "32 2 * * *"    # 11:32 KST 후보
    - cron: "32 * * * *"    # 매시 32분 게시 확인
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: insta.yml 실행 요청
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.event.schedule }}" in
            "32 21 * * *"|"32 2 * * *") MODE=topics ;;
            *) MODE=publish ;;
          esac
          # 최근 25분 안에 insta.yml 예약 실행이 이미 돌았으면(자체 schedule 이 살아 있으면) 건너뛴다
          RECENT=$(gh run list -R "${{ github.repository }}" --workflow insta.yml --limit 5 --json createdAt,event,displayTitle --jq '[.[] | select(.event=="schedule" or (.displayTitle|startswith("insta_all"))) | select((now - (.createdAt|fromdateiso8601)) < 1500)] | length')
          if [ "${RECENT:-0}" != "0" ]; then echo "최근 예약 실행 있음 — 건너뜀"; exit 0; fi
          RID="cron-$(date -u +%Y%m%d%H%M)"
          gh workflow run -R "${{ github.repository }}" insta.yml -f account=all -f mode="$MODE" -f request_id="$RID"
          echo "요청: mode=$MODE $RID"
