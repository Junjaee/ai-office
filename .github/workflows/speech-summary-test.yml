# 시험용(버리는 워크플로, 2026-11-05): 회의 발언 한 구간을 GitHub 서버에서 Claude 로 요약해 본다.
# 자막 글은 입력으로 받고, 요약은 로그에 찍지 않고 결과물(artifact)로만 내린다 — 공개 저장소.
name: speech-summary-test
run-name: "발언 요약 시험 — ${{ inputs.member }}"

on:
  workflow_dispatch:
    inputs:
      member:
        description: "위원 이름"
        required: true
      meeting:
        description: "회의 이름 (예: 예산결산특별위원회 2027년도 예산안 종합정책질의 2일차)"
        required: true
      text:
        description: "자막 글 (호명 다음부터 다음 호명 전까지)"
        required: true
      system:
        description: "지시문(비우면 기본 지시문)"
        required: false
        default: ""

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: npm install -g @anthropic-ai/claude-code
      - name: 요약
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEMBER: ${{ inputs.member }}
          MEETING: ${{ inputs.meeting }}
          TEXT: ${{ inputs.text }}
          SYSTEM_OVERRIDE: ${{ inputs.system }}
          PYTHONUTF8: "1"
        run: |
          python -X utf8 - <<'EOF'
          import json, os, sys, time
          sys.path.insert(0, "automations/common")
          from llm import LLM
          SYSTEM = """당신은 국회 의원실 보좌진을 위해 회의 발언을 정리하는 사람입니다.
          주어진 글은 국회 생중계의 AI 자막이라 오타·띄어쓰기 오류가 있고, 위원의 질의와 장관·기관장의 답변이 화자 구분 없이 섞여 있습니다.
          요구:
          - points: 위원이 물었거나 주장한 것 3~5개. 각 문장 60자 안팎, 수치·고유명사는 자막 그대로(단 명백한 오타는 바로잡되 뜻을 바꾸지 않음).
          - answers: 장관·기관장 답변 중 중요한 것 0~3개.
          - 번역투 없이 자연스러운 우리말로, 평가·논평 없이 사실만.
          설명 없이 JSON 객체 하나만 출력하세요."""
          SCHEMA = {"type": "object", "required": ["points", "answers"],
                    "properties": {"points": {"type": "array", "items": {"type": "string"}, "minItems": 1, "maxItems": 6},
                                   "answers": {"type": "array", "items": {"type": "string"}, "maxItems": 4}}}
          text, member, meeting = os.environ["TEXT"], os.environ["MEMBER"], os.environ["MEETING"]
          print(f"입력 {len(text)}자")
          t0 = time.time()
          data = LLM(["claude_cli", "gemini"]).json(system=SYSTEM, user=f"[회의: {meeting}]\n[위원: {member}]\n\n{text}", schema=SCHEMA)
          print(f"요약 완료 {time.time()-t0:.0f}초, 요점 {len(data['points'])}개, 답변 {len(data.get('answers', []))}개")
          lines = [f"🔵 {member} 위원 · {meeting}"] + [f" · {p}" for p in data["points"]] + [f" ↳ 답변: {a}" for a in data.get("answers", [])]
          open("summary.txt", "w", encoding="utf-8").write("\n".join(lines) + "\n\n[json]\n" + json.dumps(data, ensure_ascii=False, indent=1))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: summary.txt
          retention-days: 1
