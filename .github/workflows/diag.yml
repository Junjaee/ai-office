name: 진단 (네트워크)
on:
  workflow_dispatch:
jobs:
  github-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GitHub 서버(해외)에서 국회 사이트 접속 확인
        run: |
          for u in https://open.assembly.go.kr/portal/openapi/nzbyfwhwaoanttzje https://record.assembly.go.kr/assembly/mnts/main.do https://www.google.com/; do
            code=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" --max-time 25 -A "Mozilla/5.0" "$u" || echo "FAIL")
            echo "$u -> $code"
          done
      - name: GitHub 서버에서 레딧 RSS·영상 받기 확인 (인스타 해설형 릴스용, 2026-09-15)
        run: |
          code=$(curl -s -o /tmp/r.xml -w "%{http_code}" --max-time 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/128.0" "https://www.reddit.com/r/aivideo/top/.rss?t=week" || echo FAIL)
          echo "reddit rss -> $code, 영상 글 $(grep -o 'v.redd.it' /tmp/r.xml 2>/dev/null | wc -l)"
          python3 -m pip install --quiet yt-dlp >/dev/null 2>&1
          python3 -m yt_dlp -s --no-warnings --print "%(duration)s초 %(width)sx%(height)s" "https://www.reddit.com/r/aivideo/comments/1wdrs0v/what_do_you_sell_at_the_strangest_flea_market/" 2>&1 | tail -2 | sed 's/^/reddit 영상 -> /'

  office-runner:
    runs-on: [self-hosted, windows, kr-office]
    timeout-minutes: 5
    steps:
      - name: 사무실 PC에서 국회 사이트·구글 접속 확인
        # 사무실 PC 의 PowerShell 프로필이 Set-Location 등을 실행하므로 -NoProfile 로 띄운다
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'; exit $LASTEXITCODE"
        run: |
          foreach ($u in @("https://open.assembly.go.kr/portal/openapi/nzbyfwhwaoanttzje", "https://record.assembly.go.kr/assembly/mnts/main.do", "https://www.googleapis.com/discovery/v1/apis", "https://github.com/")) {
            try { $r = Invoke-WebRequest -UseBasicParsing -Uri $u -TimeoutSec 25 -UserAgent "Mozilla/5.0"; "$u -> $($r.StatusCode)" } catch { "$u -> FAIL $($_.Exception.Message)" }
          }
          "python: $(python --version 2>&1)"
          "git: $(git --version)"
