name: 진단 (네트워크)
on:
  workflow_dispatch:
jobs:
  github-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GitHub 서버(해외)에서 국회 사이트 접속 확인
        run: |
          for u in https://open.assembly.go.kr/portal/openapi/nzbyfwhwaoanttzje https://record.assembly.go.kr/assembly/mnts/main.do https://www.google.com/; do
            code=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" --max-time 25 -A "Mozilla/5.0" "$u" || echo "FAIL")
            echo "$u -> $code"
          done
      - name: GitHub 서버에서 레딧 RSS·영상 받기 확인 (인스타 해설형 릴스용, 2026-09-15)
        run: |
          code=$(curl -s -o /tmp/r.xml -w "%{http_code}" --max-time 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/128.0" "https://www.reddit.com/r/aivideo/top/.rss?t=week" || echo FAIL)
          echo "reddit rss -> $code, 영상 글 $(grep -o 'v.redd.it' /tmp/r.xml 2>/dev/null | wc -l)"
          python3 -m pip install --quiet yt-dlp >/dev/null 2>&1
          python3 -m yt_dlp -s --no-warnings --print "%(duration)s초 %(width)sx%(height)s" "https://www.reddit.com/r/aivideo/comments/1wdrs0v/what_do_you_sell_at_the_strangest_flea_market/" 2>&1 | tail -2 | sed 's/^/reddit 영상 -> /'

  webcast-live:
    # 국회 생중계 AI 자막(webcast.go.kr)을 해외 서버에서 받을 수 있는지 (실시간 발언 요약 자동화 사전 조사, 2026-11-05)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: python3 -m pip install --quiet requests websocket-client
      - name: 일반 자막 서버(socket.io) 접속 확인
        run: |
          curl -s -m 15 -A "Mozilla/5.0" -H "Origin: https://assembly.webcast.go.kr" "https://smi-dw.webcast.go.kr/socket.io/?EIO=3&transport=polling" -w "
HTTP %{http_code}
" | head -c 300
      - name: 생중계 목록·자막 웹소켓 접속 확인
        run: |
          python3 - <<'EOF'
          import json, re, time, requests, websocket
          H = {"User-Agent": "Mozilla/5.0", "Referer": "https://assembly.webcast.go.kr/main/"}
          r = requests.get("https://assembly.webcast.go.kr/main/service/live_list.asp", headers=H, timeout=25)
          print("live_list ->", r.status_code, len(r.text), "bytes")
          items = re.findall(r'"xcode":"(\d+)","xcgcd":"([^"]*)","xname":"([^"]*)".*?"xstat":"(\d)"', r.text)
          print("채널:", [(c, n, s) for c, g, n, s in items][:12])
          live = [(c, g, n) for c, g, n, s in items if s == "1" and g]
          if not live:
              print("지금 방송 중인 채널 없음 — 웹소켓 시험 생략"); raise SystemExit
          xcode, xcgcd, name = live[0]
          p = requests.get("https://assembly.webcast.go.kr/main/service/live_play.asp", params={"xcode": xcode, "xcgcd": xcgcd}, headers=H, timeout=25)
          print("live_play ->", p.status_code)
          m = re.search(r'"xsami":"([^"]+)"', p.text)
          print("xsami:", m and m.group(1))
          if not m or not m.group(1).startswith("ws"):
              raise SystemExit("자막 주소 없음")
          n, final, t0 = 0, 0, time.time()
          ws = websocket.create_connection(m.group(1), subprotocols=["echo-protocol"], timeout=20, header=["Origin: https://assembly.webcast.go.kr"])
          while time.time() - t0 < 40:
              try:
                  msg = json.loads(ws.recv())
              except Exception as e:
                  print("recv 중단:", e); break
              n += 1
              if msg.get("final"): final += 1
              if n == 1: print("첫 메시지 키:", list(msg)[:8])
          ws.close()
          print(f"{name}: 40초 동안 {n}건 수신, 최종본 {final}건")
          EOF

  office-runner:
    runs-on: [self-hosted, windows, kr-office]
    timeout-minutes: 5
    steps:
      - name: 사무실 PC에서 국회 사이트·구글 접속 확인
        # 사무실 PC 의 PowerShell 프로필이 Set-Location 등을 실행하므로 -NoProfile 로 띄운다
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'; exit $LASTEXITCODE"
        run: |
          foreach ($u in @("https://open.assembly.go.kr/portal/openapi/nzbyfwhwaoanttzje", "https://record.assembly.go.kr/assembly/mnts/main.do", "https://www.googleapis.com/discovery/v1/apis", "https://github.com/")) {
            try { $r = Invoke-WebRequest -UseBasicParsing -Uri $u -TimeoutSec 25 -UserAgent "Mozilla/5.0"; "$u -> $($r.StatusCode)" } catch { "$u -> FAIL $($_.Exception.Message)" }
          }
          "python: $(python --version 2>&1)"
          "git: $(git --version)"
