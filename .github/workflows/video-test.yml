name: 영상 받기 시험 (임시)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet --disable-pip-version-check -U yt-dlp
      - name: 유튜브 — 클라이언트별
        continue-on-error: true
        run: |
          for c in default "tv" "ios" "android" "web_embedded" "tv_embedded" "mweb"; do
            echo "=== youtube client=$c"
            if [ "$c" = default ]; then A=""; else A="--extractor-args youtube:player_client=$c"; fi
            timeout 90 python -m yt_dlp --no-warnings --skip-download $A --print "%(title).50s | %(duration)ss | %(ext)s" "https://www.youtube.com/shorts/4bGb2OjU5tA" 2>&1 | tail -2
          done
      - name: X — 기본
        continue-on-error: true
        run: |
          echo "=== x.com"
          timeout 90 python -m yt_dlp --no-warnings --skip-download --print "%(title).50s | %(duration)ss | %(ext)s" "https://x.com/sharifshameem/status/2096847916837314853" 2>&1 | tail -2
      - name: 공식 페이지 mp4/webm — 직접 받기
        continue-on-error: true
        run: |
          echo "=== deepmind webm"
          curl -s -o /tmp/a.webm -w "HTTP %{http_code} %{size_download} bytes\n" "https://storage.googleapis.com/gdm-deepmind-com-prod-public/media/pA3T_u2NdN1uywMy/alphagenome-atlas-blog__figure.webm"
