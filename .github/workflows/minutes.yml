name: 국회회의록 수집

on:
  # 예약 없음 — 회의록은 필요할 때 사이트 ▶ 시작(또는 이 PC 에서 직접 실행)으로만 돌린다 (사용자 결정 2026-09-11)
  workflow_dispatch:
    inputs:
      request_id:
        description: "화면에서 누른 요청 id (비워도 됨)"
        type: string
        default: ""

# runs API의 display_title로 "내가 누른 실행"을 결정적으로 매칭한다
run-name: ${{ github.event_name == 'workflow_dispatch' && format('수집 · {0}', inputs.request_id) || '수집 · 예약' }}

permissions:
  contents: write

concurrency:
  group: minutes
  cancel-in-progress: false

jobs:
  collect:
    # 국회 사이트는 해외 IP를 차단하므로 사무실 PC(자체 실행기, 라벨 kr-office)에서 실행한다.
    runs-on: [self-hosted, windows, kr-office]
    timeout-minutes: 60
    defaults:
      run:
        # 사무실 PC 의 PowerShell 프로필이 Set-Location 등을 실행하므로 -NoProfile 로 띄운다
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'; exit $LASTEXITCODE"
    steps:
      - uses: actions/checkout@v4

      - name: Python 확인 및 의존성 설치
        run: |
          python --version
          python -m pip install --quiet --disable-pip-version-check -r automations/requirements.txt

      - name: git 사용자 설정 (상태 파일 커밋용)
        run: |
          git config user.name "ai-office-bot"
          git config user.email "ai-office-bot@users.noreply.github.com"

      # GOOGLE_REFRESH_TOKEN 검사는 Python(collect_minutes.py)이 한다: 비어 있으면
      # 상태 파일에 "구글 드라이브 인증이 없거나 만료됐어요"를 남기고 exit 1.
      - name: 수집 실행
        env:
          OPEN_API_KEY: ${{ secrets.OPEN_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          REQUEST_ID: ${{ inputs.request_id }}
          PYTHONUTF8: "1"
        run: |
          python -X utf8 automations/minutes/collect_minutes.py --daily --config automations/minutes/config.actions.yaml
          exit $LASTEXITCODE
