name: 국회회의록 수집

on:
  schedule:
    - cron: "0 0 * * *"        # 매일 09:00 KST (UTC 00:00)
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 방식"
        type: choice
        default: daily
        options: [daily, dry-run]

permissions:
  contents: write

concurrency:
  group: minutes
  cancel-in-progress: false

jobs:
  collect:
    # 국회 사이트는 해외 IP를 차단하므로 사무실 PC(자체 실행기, 라벨 kr-office)에서 실행한다.
    runs-on: [self-hosted, windows, kr-office]
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Python 확인 및 의존성 설치
        run: |
          python --version
          python -m pip install --quiet --disable-pip-version-check -r automations/requirements.txt

      - name: git 사용자 설정 (상태 파일 커밋용)
        run: |
          git config user.name "ai-office-bot"
          git config user.email "ai-office-bot@users.noreply.github.com"

      - name: 수집 실행
        env:
          OPEN_API_KEY: ${{ secrets.OPEN_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          PYTHONUTF8: "1"
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if (-not $env:GOOGLE_REFRESH_TOKEN) {
            Write-Host "::warning::Google Drive 인증 secrets가 없어 이번 실행을 건너뜁니다."
            exit 0
          }
          $extra = @()
          if ($env:MODE -eq "dry-run") { $extra = @("--dry-run") }
          python -X utf8 automations/minutes/collect_minutes.py --daily @extra --config automations/minutes/config.actions.yaml
          exit $LASTEXITCODE
