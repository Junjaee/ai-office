name: 인스타 게시글

on:
  schedule:
    # 매일 06:30 KST — 밤사이 미국 소식까지 넣어 후보를 검토 칸에 올림 (UTC 21:30 전날) — 모든 계정
    - cron: "30 21 * * *"
    # 매일 11:30 KST — 오전 소식으로 후보 새로 고침 (12:30·18:30 자동 선정용, UTC 02:30)
    - cron: "30 2 * * *"
    # 매시 30분 — 댓글 DM → 예약 게시 (게시 시간대 07:30·12:30·18:30 과 맞춤, 빈 칸은 1순위 자동 선정) — 모든 계정
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      account:
        description: "계정 이름 (config.actions.yaml 의 accounts 키: aitips / parent / benefit, all=전부)"
        type: string
        default: "aitips"
      mode:
        description: "topics=후보 뽑기 / queue=고른 것 예약+게시 / publish=예약된 것 게시 / auto=자동 선택 / edit=예약 수정 / stats=지표 / run=1건(시험)"
        type: choice
        options: [topics, queue, publish, auto, edit, stats, run]
        default: "topics"
      picks:
        description: "queue 방식에서 고른 후보 id (쉼표). 사이트 검토 칸이 채운다"
        type: string
        default: ""
      edits:
        description: "edit 방식: 예약 수정 (id=cancel | id=HH:MM | id=YYYY-MM-DDTHH:MM, 쉼표). 사이트 검토 칸이 채운다"
        type: string
        default: ""
      request_id:
        description: "화면에서 누른 요청 id (비워도 됨)"
        type: string
        default: ""

# runs API 의 display_title 로 "내가 누른 실행"을 결정적으로 매칭한다 — 바꾸지 말 것. 예약 실행은 모든 계정을 한 번에 돈다
run-name: ${{ github.event_name == 'workflow_dispatch' && format('insta_{0} · {1}', inputs.account, inputs.request_id) || 'insta · 예약' }}

permissions:
  contents: write

concurrency:
  # 게시가 일어날 수 있는 실행(예약·예약 시계 account=all·queue/publish/auto)은 한 줄로 세운다 — 두 실행이 같은 예약 글을 동시에 올리지 않게 (2026-09-14)
  group: insta-${{ (github.event_name == 'schedule' || inputs.account == 'all' || inputs.mode == 'queue' || inputs.mode == 'publish' || inputs.mode == 'auto') && 'publish' || inputs.account }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 계정별 인스타그램 토큰 — 계정을 더하면 여기에 세 줄씩 추가 (없는 계정은 비어 있고, 코드가 게시만 건너뛴다)
      INSTA_AITIPS_TOKEN: ${{ secrets.INSTA_AITIPS_TOKEN }}
      INSTA_AITIPS_USER_ID: ${{ secrets.INSTA_AITIPS_USER_ID }}
      INSTA_AITIPS_USERNAME: "aitips.kr"
      INSTA_PARENT_TOKEN: ${{ secrets.INSTA_PARENT_TOKEN }}
      INSTA_PARENT_USER_ID: ${{ secrets.INSTA_PARENT_USER_ID }}
      INSTA_PARENT_USERNAME: ${{ vars.INSTA_PARENT_USERNAME }}
      INSTA_BENEFIT_TOKEN: ${{ secrets.INSTA_BENEFIT_TOKEN }}
      INSTA_BENEFIT_USER_ID: ${{ secrets.INSTA_BENEFIT_USER_ID }}
      INSTA_BENEFIT_USERNAME: ${{ vars.INSTA_BENEFIT_USERNAME }}
      # 릴스 목소리 (타입캐스트 · 구글 Chirp 3 HD) — 비어 있으면 무료 엣지 음성으로
      TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      # 줄 서서 기다린 실행은 트리거 시점의 옛 파일을 받으므로, 시작할 때 최신 상태(예약·게시 기록)를 다시 받는다
      - name: 최신 상태 받기
        run: git pull -q --rebase origin main || git pull -q origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 예약(cron) 이면 모든 계정, 화면에서 누른 실행이면 그 계정 하나. publish 인데 만들 것이 없으면 여기서 끝낸다 (의존성 설치 전 — 실행 시간 절약)
      - name: 실행 방식 정하기
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.account }}" = "all" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              case "${{ github.event.schedule }}" in
                "30 21 * * *"|"30 2 * * *") MODE=topics ;;
                *) MODE=publish ;;
              esac
            else
              MODE="${{ inputs.mode || 'publish' }}"     # 예약 시계(insta-cron.yml)가 account=all 로 부른다
            fi
            ACCOUNTS=$(python - <<'PY'
          import re
          text = open("automations/insta/config.actions.yaml", encoding="utf-8").read()
          print(" ".join(re.findall(r"^  ([a-z0-9_]+):[^\n]*\n    profile:", text, re.M)))   # accounts 항목 = 바로 아래 profile: 이 있는 것
          PY
          )
          else
            MODE="${{ inputs.mode || 'topics' }}"
            ACCOUNTS="${{ inputs.account || 'aitips' }}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "accounts=$ACCOUNTS" >> "$GITHUB_OUTPUT"
          DUE=false
          if [ "$MODE" = "publish" ]; then
            for A in $ACCOUNTS; do
              if [ "$(python automations/insta/review_due.py --workspace side --automation "insta_$A")" = "true" ]; then DUE=true; fi
              H=$(TZ=Asia/Seoul date +%H%M)
              # 게시 시간대 창(07:30~08:44 · 12:30~13:44 · 18:30~19:44) 이면 빈 칸 자동 선정을 위해 실행한다
              case "$H" in 073[0-9]|07[4-5][0-9]|08[0-3][0-9]|084[0-4]|123[0-9]|12[4-5][0-9]|13[0-3][0-9]|134[0-4]|183[0-9]|18[4-5][0-9]|19[0-3][0-9]|194[0-4]) DUE=true ;; esac
            done
          elif [ "$MODE" = "edit" ]; then
            DUE=false
          else
            DUE=true
          fi
          echo "due=$DUE" >> "$GITHUB_OUTPUT"
          echo "방식=$MODE 계정=$ACCOUNTS 만들 것=$DUE"

      # 댓글 → DM: 매시 예약 확인 때마다(의존성 없이) 최근 7일 게시물의 댓글을 보고 프롬프트를 DM 으로 보낸다 (사용자 결정 2026-09-12). 계정마다
      - name: 댓글 답장 (DM)
        if: steps.mode.outputs.mode == 'publish' || steps.mode.outputs.mode == 'auto'
        run: |
          git config user.name "ai-office-bot"
          git config user.email "ai-office-bot@users.noreply.github.com"
          for A in ${{ steps.mode.outputs.accounts }}; do
            echo "== $A"
            python -X utf8 automations/insta/insta_dm.py --account "$A" || echo "댓글 답장 실패($A) — 계속"
          done
          if ! git diff --quiet -- data/insta; then
            git add data/insta && git commit -qm "insta: 댓글 DM 기록" && git pull -q --rebase origin main && git push -q origin main
          fi

      # 대기 릴스: 이 PC 에서 만든 완성 릴스(해설형 영상 등)를 게시 시각이 되면 올린다 (insta_outbox.py, 사용자 결정 2026-09-15).
      # 영상·표지는 GitHub 릴리스 'outbox-<계정>' 첨부에서 받고, 게시 뒤 지운다. 대기 목록이 있는 계정만 부품을 설치한다
      - name: 대기 릴스 게시
        if: steps.mode.outputs.mode == 'publish' || steps.mode.outputs.mode == 'auto'
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          for A in ${{ steps.mode.outputs.accounts }}; do
            if ls data/insta/$A/outbox/*.json >/dev/null 2>&1; then
              python -m pip install --quiet --disable-pip-version-check boto3 requests
              echo "== $A"
              python -X utf8 automations/insta/insta_outbox.py publish --account "$A" || echo "대기 릴스 게시 실패($A) — 계속"
            fi
          done
          if [ -n "$(git status --porcelain -- data/insta)" ]; then
            git add data/insta && git commit -qm "insta: 대기 릴스 게시 기록" && git pull -q --rebase origin main && git push -q origin main
          fi

      # 예약 취소·시각 변경: 의존성 없이 검토 파일만 고쳐 커밋 (20초)
      - name: 예약 수정
        if: steps.mode.outputs.mode == 'edit'
        env:
          ACCOUNT: ${{ inputs.account || 'aitips' }}
          EDITS: ${{ inputs.edits }}
        run: |
          git config user.name "ai-office-bot"
          git config user.email "ai-office-bot@users.noreply.github.com"
          python automations/insta/review_edit.py --workspace side --automation "insta_$ACCOUNT" --edits "$EDITS"
          git add public/review && git commit -qm "insta($ACCOUNT): 예약 수정" || echo "바뀐 것 없음"
          git pull -q --rebase origin main && git push -q origin main

      - name: 의존성 설치 (파이썬 + 카드용 Chromium + Claude Code CLI + 릴스용 ffmpeg)
        if: steps.mode.outputs.due == 'true'
        run: |
          python --version
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 && ffmpeg -version | head -1   # 릴스 변환용 (실행기 기본 이미지에 없음)
          python -m pip install --quiet --disable-pip-version-check -r automations/requirements.txt
          python -m playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code

      - name: git 사용자 설정 (상태 파일 커밋용)
        if: steps.mode.outputs.due == 'true'
        run: |
          git config user.name "ai-office-bot"
          git config user.email "ai-office-bot@users.noreply.github.com"

      # 계정마다 차례로. 한 계정이 실패해도 나머지는 계속 돌고, 마지막에 실패로 표시한다
      - name: 실행
        if: steps.mode.outputs.due == 'true'
        env:
          # 글 생성: Claude 구독 토큰 (Gemini 예비 키는 두지 않기로 함 — 사용자 결정 2026-09-11)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 이미지 공개 URL (Cloudflare R2) — 계정 공통 (경로가 insta/<계정>/ 으로 나뉜다)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          # 참고 계정 읽기(비즈니스 디스커버리) — 페이스북 페이지에 연결된 계정의 장기 토큰 (계정 공통)
          IG_DISCOVERY_TOKEN: ${{ secrets.IG_DISCOVERY_TOKEN }}
          IG_DISCOVERY_USER_ID: ${{ secrets.IG_DISCOVERY_USER_ID }}
          INSTA_MODE: ${{ steps.mode.outputs.mode }}
          INSTA_PICKS: ${{ inputs.picks }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          FAIL=0
          for A in ${{ steps.mode.outputs.accounts }}; do
            echo "=============== 계정 $A ==============="
            INSTA_ACCOUNT=$A python -X utf8 automations/insta/run_insta.py --config automations/insta/config.actions.yaml || FAIL=1
          done
          exit $FAIL

      - name: 만든 카드 보관 (7일)
        if: always() && steps.mode.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: insta-cards-${{ github.run_id }}
          path: automations/insta/out/
          retention-days: 7
          if-no-files-found: ignore
