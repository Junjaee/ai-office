# 지방의회 회의록 — GitHub Actions 실행용 설정. 비밀값은 여기 두지 않고 환경변수(GOOGLE_*)로 받는다.

# 결과를 둘 구글 드라이브 상위 폴더. 그 안에 의회별 폴더가 자동으로 생긴다.
drive_folder_id: "10Pf9m4v1R08Znthq4wrhw5g-yv4szs3S"   # 내 드라이브/직장/국회/01. 의정활동/02. 위원회_회의/지방의회 회의록 (국회회의록 _회의록 옆, 2026-10-23)
result_link: "https://drive.google.com/drive/folders/10Pf9m4v1R08Znthq4wrhw5g-yv4szs3S"

request_delay: 1.5       # 사이트 요청 간격(초). 1초 이상 유지
retries: 3
timeout: 60
per_run_limit: 150       # 의회 하나당 한 번 실행에 받는 최대 건수 (과거분은 여러 날에 나눠 받는다). 첫 실행 실측: 1건에 약 20초(드라이브 올리기 포함)
time_budget_min: 200     # 전체 실행 시간 예산(분). 넘으면 멈추고 보고한다 — 워크플로 상한 300분보다 짧게

# 상태 보고: 저장소 루트(체크아웃 위치)에 커밋
office_repo: "."
office_workspace: "assembly"
next_run: "매일 02:00"

# 화면의 직원(하위 작업) id. 원천은 app/workspaces/assembly.ts 의 automations[].tasks[] (테스트로 일치 강제)
tasks: [scan, fetch]
