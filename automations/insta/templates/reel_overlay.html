<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Pretendard"; src: url("{{ font_url }}") format("woff2-variations"); font-weight: 100 900; }
  html, body { margin: 0; width: {{ width }}px; height: {{ height }}px; background: transparent; overflow: hidden; }
  body { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: {{ theme.fg }}; position: relative; }
  /* 위·아래 어두운 띠: 글자가 어떤 영상 위에서도 읽히게 */
  .top { position: absolute; left: 0; top: 0; width: 100%; height: 620px; background: linear-gradient(180deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.55) 55%, rgba(0,0,0,0) 100%); }
  .bottom { position: absolute; left: 0; bottom: 0; width: 100%; height: 520px; background: linear-gradient(0deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.35) 60%, rgba(0,0,0,0) 100%); }
  .brand { position: absolute; left: 60px; top: 150px; display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 999px; background: {{ theme.accent }}; color: {{ theme.bg }}; font-weight: 800; font-size: 28px; letter-spacing: .06em; }
  .title { position: absolute; left: 60px; top: 230px; width: 820px; font-size: 68px; line-height: 1.22; font-weight: 800; word-break: keep-all; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .sub { position: absolute; left: 60px; top: 520px; width: 820px; font-size: 34px; line-height: 1.4; color: #e8ebf0; word-break: keep-all; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .credit { position: absolute; left: 60px; bottom: 360px; font-size: 28px; color: #d9dde5; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  .handle { position: absolute; left: 60px; bottom: 310px; font-size: 26px; color: {{ theme.accent }}; font-weight: 700; }
</style></head>
<body>
  <div class="top"></div>
  <div class="bottom"></div>
  <div class="brand">{{ slide.brand }}</div>
  <div class="title" data-fit="46">{{ slide.title }}</div>
  {% if slide.sub %}<div class="sub">{{ slide.sub }}</div>{% endif %}
  <div class="credit">{{ slide.credit }}</div>
  {% if slide.handle %}<div class="handle">{{ slide.handle }}</div>{% endif %}
  <script>
    // 제목이 세 줄을 넘으면 글자를 줄인다 (카드의 __fit 과 같은 방식)
    window.__fit = function () {
      document.querySelectorAll("[data-fit]").forEach(function (el) {
        var min = parseInt(el.getAttribute("data-fit"), 10) || 40;
        var size = parseFloat(getComputedStyle(el).fontSize);
        var maxH = size * 1.22 * 3 + 4;
        while (el.scrollHeight > maxH && size > min) { size -= 2; el.style.fontSize = size + "px"; maxH = size * 1.22 * 3 + 4; }
      });
    };
  </script>
</body></html>
