# 정책·정치 브리핑 (@today.policy.kr, 옛 @aitips.kr — 2026-09-16 사용자 결정 "카테고리는 정치")
# 컨셉: 국회에서 법안·예산을 직접 보는 사람이, 오늘 바뀐 것 중 내 생활에 닿는 것 하나를 30초로.
# 실측 근거(2026-09-16): 씨리얼 팔로워 2.6만 · 평균 좋아요 7.6천(참여율 29%), 스브스뉴스 26.8만 · 8.1천(3%),
#                       반면 KBS·JTBC 뉴스 계정은 팔로워 30만대에 좋아요 수십 개. → 뉴스 전달이 아니라 관점 있는 1분 설명이어야 한다.
name: 정책·정치 브리핑
handle: "@today.policy.kr"        # 2026-09-16 사용자가 아이디 변경. config.actions.yaml 의 handle 과 함께 맞춘다
brand: "오늘 바뀐 것"             # 카드·릴스 위 브랜드 라벨
audience: "뉴스는 보지만 국회·정부 발표 원문까지는 안 보는 20~40대. 내 월급·세금·집·일자리에 뭐가 바뀌는지 알고 싶어 한다."
tone: "차분하고 단정한 설명체. 짧은 존댓말. 한 문장에 한 가지. 편들기·비아냥 금지. 사실과 출처를 먼저 말하고 해석은 마지막에 한 줄."
format: news
paragraphs: 6
title_patterns:
  - "시행형: '<날짜>부터 <무엇>이 이렇게 바뀝니다'"
  - "대상형: '<누구>라면 <금액·혜택>, 신청은 <언제까지>'"
  - "숫자형: '예산 <금액>, 어디로 가는지 뜯어봤습니다'"
  - "통념 뒤집기형: '<흔한 오해>, 원문에는 이렇게 적혀 있습니다'"
  - "보낼 상대형: '이거 모르면 손해 보는 사람 태그'"
must_include:
  - "언제부터 적용되는지(시행일·처리일)"
  - "누구에게 해당하는지(대상·조건)"
  - "근거 원문(의안번호·법률명·부처 발표). 링크는 캡션에"
  - "지금 할 일 한 줄(신청·확인·준비)"
banned: ["충격", "경악", "역대급", "무조건", "!!!", "매국", "독재", "빨갱이", "종북", "친일파", "쓰레기", "최악의"]
cta: "저장해 두고 해당되는 사람에게 보내세요"
hashtags_base: ["#정책", "#제도변경", "#생활정보", "#국회", "#법안", "#예산", "#세금", "#시행"]
# 실측으로 반응이 좋았던 설명형 시사 계정 (뉴스 그대로 전하는 계정은 참여율이 낮아 제외)
watch_accounts: [subusunews, creal.official, newneek.official]
watch_foreign: []
watch_cap: 12
watch_per_account: 4
sources: [assembly_bills, gnews_assembly, gnews_cabinet, gnews_notice, gnews_law, gnews_budget, yna_politics, yna_economy]
source_caps: { yna_politics: 6, yna_economy: 6, gnews_law: 6, gnews_assembly: 6, gnews_cabinet: 6, gnews_notice: 6, gnews_budget: 6, assembly_bills: 12 }
source_signals: ["시행", "신청", "통과", "개정", "지원", "인상", "인하", "확대", "폐지", "유예", "의무", "적용", "예산", "세금", "공제", "환급"]
signal_required: [yna_politics, yna_economy, gnews_law, gnews_budget]   # 넓은 피드는 신호 단어가 있는 글만
exclude_words: ["[인사]", "[부고]", "동정", "취임", "간담회", "협약", "포럼", "세미나", "출마", "경선", "공천", "여론조사", "지지율",
                "시의회", "도의회", "군의회", "구의회", "추경", "시장", "군수", "구청장", "도지사", "시청", "군청", "[사설]", "[칼럼]"]   # 지역 소식·의견 글 제외(전국 독자 대상)
max_age_hours: 72     # 의안은 하루 단위로 올라온다
template: dark_code
theme: { bg: "#0f1724", fg: "#f4f6fa", muted: "#93a3bb", accent: "#4ea1ff", card: "#17202f", code_bg: "#0a0f18" }
judge_weights: { readability: 3, interest: 3, factual: 4, structure: 1 }   # 정치·정책은 사실 정확도에 가중치
pass_score: 42            # 가중치 합이 11(최대 55)이라 aitips(38/50)와 같은 비율
pick_rules: |
  이 계정은 국회에서 법안·예산을 직접 보는 사람이 운영한다. 기준은 세 가지다.
  ① 내 생활에 닿는가 — 월급·세금·집·일자리·가족에 실제로 영향이 있는 것. 정당 간 공방 자체는 소재로 쓰지 않는다.
  ② 원문으로 확인되는가 — 의안번호·법률명·부처 발표처럼 근거를 댈 수 있어야 한다. 기사 해석만 있는 것은 뒤로 미룬다.
  ③ 시점이 분명한가 — 언제부터 바뀌는지, 언제까지 신청하는지가 있는 것이 좋다.
  정당·인물 평가, 선거 예측, 지지율, 공천·경선 이야기는 고르지 않는다(계정이 정치 계정으로 분류되면 추천에서 빠지고, 협찬도 막힌다).
  같은 사안이면 원문(국회 의안·부처 발표)에 가장 가까운 후보 하나만 고른다.
