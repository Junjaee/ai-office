# 주제 프로필: AI 툴·프롬프트 꿀팁 (계정 aitips). 다른 주제는 이 파일을 복사해 값만 바꾼다.
name: AI 툴·프롬프트 꿀팁
handle: "@aitips"                # 카드 구석에 찍히는 계정 표시. 실제 계정 아이디로 바꾼다
audience: "AI 를 업무·공부에 쓰고 싶은 20~40대 직장인·학생. 개발자가 아니다."
tone: "친한 선배가 알려주는 말투. 짧은 존댓말(~해요/~돼요). 과장·감탄사 금지. 한 문장에 한 가지."
format: news                      # news | list | howto | research | checklist
slides: 8                         # 표지 1 + 본문 6 + 마무리 1

# 표지 제목 규칙: 뉴스 헤드라인처럼 "무엇이 어떻게 됐다" (예: "Windows용 제미나이 앱 출시"). 낚시성 금지.
# 부제: 독자 이득 한 줄 (예: "Alt+Space 한 번이면 화면 위에 AI 비서").
hook_patterns:
  - "뉴스형: '<제품·기능> 출시/업데이트' (헤드라인) + 부제로 이득 한 줄"
  - "숫자형: 나만 빼고 다 아는 <툴> 명령어 N개"
  - "결과물형: 평범한 사진 한 장을 <결과>로 만들어보세요"
  - "질문형: <툴>이 이렇게까지 해 주는데, 가만히 있으실 거예요?"

# 소재 유형별 카드 순서 (본문 6장). 모델은 이 순서를 따른다.
flow:
  news: ["언제·누가·무엇을 내놨는지(날짜 명시) + 공식 화면", "장점·달라진 점 1", "장점·달라진 점 2", "장점·달라진 점 3 또는 실제 활용 예시", "켜는 법·쓰는 법(단축키·메뉴 순서)", "받는 곳·조건(주소, 지원 OS, 요금·구독 여부)"]
  list: ["왜 이게 필요한지(문제)", "항목 1", "항목 2", "항목 3", "항목 4", "항목 5 + 어디서 더 볼지"]
  howto: ["결과물이 무엇인지", "준비물·조건", "1단계", "2단계", "3단계 + 예시 입력", "실패할 때·주의점"]

must_include:
  - "툴 이름은 한글 표기 + 영문 병기 1회 (예: 제미나이(Gemini))"
  - "무료/유료·구독 여부"
  - "바로 따라 할 수 있는 한 줄 예시나 명령"
  - "출시·업데이트 소식이면 날짜"
banned: ["혁신적인", "게임체인저", "놀라운", "!!!", "무조건", "완전 대박", "충격", "역대급"]
cta: "저장해 두고 하나씩 써보세요 · 필요한 분께 공유"
hashtags_base: ["#AI활용", "#챗GPT", "#제미나이", "#업무자동화", "#생산성", "#AI툴", "#프롬프트"]
sources: [openai_news, anthropic_news, google_ai, geeknews, aitimes, producthunt_ai, reddit_chatgpt, reddit_claude, huggingface]
source_signals: ["프롬프트", "prompt", "사용법", "무료", "free", "업데이트", "기능", "feature", "자동", "단축", "tip", "how to", "출시", "launch"]
max_age_hours: 72
template: dark_code
theme: { bg: "#15171c", fg: "#f5f6f8", muted: "#9aa3b2", accent: "#f2b544", card: "#1f2229", code_bg: "#0d0f13" }
images_per_post: 3                # 실제 화면·제품 사진을 넣을 카드 수 (표지 포함)
judge_weights: { hook: 2, useful: 3, factual: 3, korean: 1, rules: 1 }
pass_score: 38                    # 최대 50 (5점×가중치 합 10)
references: refs/aitips.md
