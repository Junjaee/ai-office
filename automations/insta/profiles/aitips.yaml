# 주제 프로필: AI 툴·프롬프트 꿀팁 (계정 aitips). 다른 주제는 이 파일을 복사해 값만 바꾼다.
name: AI 툴·프롬프트 꿀팁
handle: "@aitips.kr"          # 카드 구석에 찍히는 계정 표시 (실제 인스타 사용자 이름)
audience: "AI 를 업무·공부에 쓰고 싶은 20~40대 직장인·학생. 개발자가 아니다."
tone: "친한 선배가 알려주는 말투. 짧은 존댓말(~해요/~돼요). 과장·감탄사 금지. 한 문장에 한 가지."
format: news                      # news | list | howto (기사 문단 순서의 기본 감각)
paragraphs: 6                     # 기사 문단 수 = 본문 카드 수 (표지·마무리 제외)

# 제목 규칙: 스크롤을 멈추게 하되 사실을 벗어나지 않는다. 부제는 독자 이득 한 줄.
title_patterns:
  - "뉴스형: '<누가>, <무엇> 출시/업데이트' + 부제로 이득 한 줄 (예: '구글, 윈도우용 제미나이 앱 출시')"
  - "숫자형: '나만 빼고 다 아는 <툴> 기능 N개'"
  - "결과물형: '평범한 사진 한 장을 <결과>로 만드는 법'"
  - "질문형: '<툴>이 이렇게까지 해 주는데 아직 안 써요?'"

must_include:
  - "툴 이름은 한글 표기 + 영문 병기 1회 (예: 제미나이(Gemini))"
  - "무료/유료·구독 여부"
  - "바로 따라 할 수 있는 한 줄 예시나 입력 문장"
  - "출시·업데이트 소식이면 날짜"
banned: ["혁신적인", "게임체인저", "놀라운", "!!!", "무조건", "완전 대박", "충격", "역대급"]
cta: "저장해 두고 하나씩 써보세요 · 필요한 분께 공유"
hashtags_base: ["#AI활용", "#챗GPT", "#제미나이", "#업무자동화", "#생산성", "#AI툴", "#프롬프트"]
# 참고 계정(프로페셔널 계정만 조회 가능) — 최근 게시물·좋아요를 읽어 후보에 넣는다. IG_DISCOVERY_TOKEN/USER_ID 필요
# 🇰🇷 한국 AI 인스타 (같은 주제를 골라도 됨 — 사용자 결정 2026-09-12). hyunsight·un_ni_tip 은 AI 계정이 아니라 뺐다(출처 탐색 2026-09-11)
watch_accounts: [ai.trend.kr, ai_freaks.kr, prompt_what, ai_dori_, trenddalkak.ai]
# 🇺🇸 미국 원출처(회사 공식·뉴스레터) — 최근 48시간. 한국 계정이 아직 안 다룬 것은 "빈자리"로 표시
watch_foreign: [openai, openaidevs, googledeepmind, googlegemini, grok, therundownai, chatgptricks, evolving.ai, rowancheung]
watch_foreign_hours: 48
watch_cap: 15                     # 그룹(🇰🇷/🇺🇸)별 후보 상한
watch_per_account: 4              # 계정당 상한 — 좋아요 큰 계정이 독식하지 않게
sources: [openai_news, anthropic_news, deepmind, google_ai, yt_openai, yt_anthropic, yt_deepmind, yt_gemini, rundown, testingcatalog, techcrunch_ai, huggingface, geeknews, aitimes, producthunt_ai, reddit_chatgpt]
source_caps: { reddit_chatgpt: 5, producthunt_ai: 5, techcrunch_ai: 5, testingcatalog: 6, yt_openai: 4, yt_anthropic: 3, yt_deepmind: 3, yt_gemini: 3 }     # 시끄러운 출처는 후보 상한
source_signals: ["프롬프트", "prompt", "사용법", "무료", "free", "업데이트", "기능", "feature", "자동", "단축", "tip", "how to", "출시", "launch"]
max_age_hours: 72
template: dark_code
theme: { bg: "#15171c", fg: "#f5f6f8", muted: "#9aa3b2", accent: "#f2b544", card: "#1f2229", code_bg: "#0d0f13" }

# 검수(글쓰기 전문가) 채점: readability·interest·factual·structure 각 1~5점 × 가중치, 최대 50
judge_weights: { readability: 3, interest: 3, factual: 3, structure: 1 }
pass_score: 38
references: refs/aitips.md
