# 주제 프로필: 돈 되는 정책·혜택 알림 (계정 benefit). 2026-09-14 사용자 결정(여러 계정).
name: 돈 되는 혜택 알림
handle: "@benefit.kr"            # 계정을 만들면 실제 사용자 이름으로 바꾼다
audience: "20~40대 직장인·청년·자영업자. 정부 지원금·환급·카드 혜택처럼 '신청만 하면 받는 돈'을 놓치기 싫어한다."
tone: "은행 창구 직원이 아니라 눈치 빠른 친구가 귀띔하는 말투. 짧은 존댓말. 과장 금지. 대상·금액·기간은 숫자로."
format: news
paragraphs: 6

title_patterns:
  - "금액형: '신청만 하면 <금액> — <대상>은 오늘 확인하세요'"
  - "마감형: '<날짜>까지 안 하면 사라지는 <혜택>'"
  - "대상형: '<조건>이면 해당돼요: <혜택> 총정리'"
  - "질문형: '이 환급금 아직도 안 받으셨어요?'"

must_include:
  - "대상(누가)·금액(얼마)·기간(언제까지)·신청 방법(어디서, 링크 이름)"
  - "근거 기관(정부·지자체·기관 공식 안내)"
  - "바로 할 수 있는 한 줄 행동(오늘 신청·조회)"
banned: ["충격", "경악", "무조건", "완전 대박", "!!!", "역대급", "공짜돈", "몰래"]
cta: "저장해 두고 마감 전에 신청하세요 · 해당되는 친구에게 공유"
hashtags_base: ["#정부지원금", "#지원금신청", "#청년지원", "#환급", "#절약", "#재테크", "#생활정보"]

watch_accounts: []
watch_foreign: []
sources: [bing_benefit_apply, bing_benefit_youth, bing_benefit_refund, bing_benefit_gov, bing_benefit_card, yna_economy, yna_society]
source_caps: { yna_economy: 10, yna_society: 8 }
source_signals: ["신청", "지급", "환급", "지원금", "혜택", "마감", "확대", "인상", "무료", "할인", "청년", "소상공인", "이번 달", "오늘부터"]
max_age_hours: 72
signal_required: [yna_economy, yna_society]   # 넓은 피드는 신호 단어(신청·지급·환급·지원금…)가 있는 글만
exclude_words: ["[인사]", "[부고]", "동정", "군수", "군민", "읍면", "면장", "구청장", "취임", "간담회", "협약", "포럼", "세미나", "정기예금 금리", "주가", "실적"]
template: dark_code
theme: { bg: "#0f1b2d", fg: "#f5f7fb", muted: "#9fb0c8", accent: "#5ee0a0", card: "#16263d", code_bg: "#0a1220" }

judge_weights: { readability: 3, interest: 3, factual: 4, structure: 1 }
pass_score: 40
references: refs/benefit.md
pick_rules: >
  최우선은 "신청만 하면 받는 돈"이다: (1) 전국 단위 정부·공공 지원금·환급·바우처(대상·금액·기간이 분명한 것) (2) 청년·직장인·자영업자 대상 제도 변화(세금·건보료·통신비·교통비 절감) (3) 마감이 임박한 것.
  정치 공방·예산 논쟁·특정 지역 소액 행사·업체 광고성 기사는 고르지 않는다. 사실 확인이 안 되는 숫자는 쓰지 않는다. 1번은 자동 게시되므로 가장 많은 사람이 해당되는 것으로.
