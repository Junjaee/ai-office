# 주제 프로필: 육아 꿀팁·혜택 (계정 parent). 2026-09-14 사용자 결정(여러 계정, 육아 포함).
name: 육아 꿀팁·혜택
handle: "@momtips.kr"            # 계정을 만들면 실제 사용자 이름으로 바꾼다 (config.actions.yaml 의 handle 이 우선)
audience: "0~7세 아이를 키우는 부모(특히 엄마). 시간이 없고, 돈 되는 정보·검증된 육아 방법을 저장해 두고 싶어 한다."
tone: "같은 또래 아이 키우는 친구가 알려주는 말투. 짧은 존댓말(~해요/~돼요). 겁주기·훈계 금지. 한 문장에 한 가지."
format: news
paragraphs: 6

title_patterns:
  - "혜택형: '이번 달 놓치면 <금액> 날아가요' / '<대상>이면 신청만 하면 <금액>'"
  - "숫자형: '아이 감기 병원 가기 전 체크 3가지'"
  - "공감형: '밤에 안 자는 아이, 이거 하나 바꿨더니'"
  - "질문형: '부모급여 오른 거 아직 모르세요?'"

must_include:
  - "혜택·제도 소식이면 대상·금액·신청 기간·신청 방법(어디서)·근거 기관"
  - "육아 방법이면 몇 살 기준인지와 근거(기관·전문가·공식 자료)"
  - "바로 할 수 있는 한 줄 행동(오늘 신청·오늘 확인)"
banned: ["충격", "경악", "무조건", "완전 대박", "!!!", "역대급", "아이가 죽을", "위험천만"]
cta: "저장해 두고 신청 기간 놓치지 마세요 · 같이 키우는 친구에게 공유"
hashtags_base: ["#육아꿀팁", "#육아정보", "#부모급여", "#아동수당", "#육아맘", "#워킹맘", "#초보엄마"]

# 참고 계정(프로페셔널만 조회 가능) — 아직 없음. 좋은 육아 계정을 찾으면 여기 추가
watch_accounts: []
watch_foreign: []
sources: [bing_parent_support, bing_parent_allowance, bing_parent_tips, bing_parent_health, babynews, yna_society]
source_caps: { babynews: 8, yna_society: 8 }
source_signals: ["신청", "지원", "지급", "무료", "확대", "인상", "방법", "체크", "꿀팁", "병원", "어린이집", "유치원", "수당", "급여"]
max_age_hours: 96
template: dark_code
theme: { bg: "#fff7f0", fg: "#2b2420", muted: "#8a7a70", accent: "#ff8a5b", card: "#ffffff", code_bg: "#fdebe0" }

judge_weights: { readability: 3, interest: 3, factual: 3, structure: 1 }
pass_score: 38
references: refs/parent.md
pick_rules: >
  최우선은 대중성과 실익이다: (1) 돈이 되는 제도 변화(부모급여·아동수당·보육료·의료비·지역 지원금 — 대상·금액·기간이 분명한 것) (2) 오늘 바로 써먹는 육아 방법(수면·이유식·병원·어린이집 적응, 공식 기관·전문가 근거가 있는 것) (3) 부모가 공감하는 화제.
  정치·사건사고·특정 인물 논란·업체 홍보성 기사는 고르지 않는다. 지역 한정 소식은 전국 대상이 아니면 뒤로 뺀다. 1번은 자동 게시되므로 가장 많은 부모에게 해당되는 것으로.
