# 인스타 게시글 자동화 — GitHub Actions 실행용 설정. 비밀값은 여기 두지 않고 환경변수(GitHub Secrets)로 받는다.
# 코드는 플랫폼당 한 벌(이 폴더). 계정마다 아래 accounts 에 한 항목씩 더한다 (팀 = 플랫폼, 자동화 = 계정).

default_account: aitips

accounts:
  aitips:
    profile: aitips                          # profiles/<이름>.yaml
    handle: "@aitips.kr"                  # 카드에 찍히는 표시 (실제 인스타 사용자 이름)
    dept: research                           # 사무실 설정의 부서 id (인스타 게시글팀)
    result_link: "https://www.instagram.com/aitips.kr/"
    posts_per_run: 1                         # 실행 1회에 올릴 게시물 수
    candidates_to_llm: 40                    # 소재 후보를 몇 개까지 편집장(모델)에게 보여 줄지
    review_count: 20                         # 매일 검토 칸에 올릴 후보 수 (사용자 결정 2026-09-12: 최대 20)
    auto_pick: 0                             # 자동 게시 멈춤 (2026-09-15 사용자: 릴스 고도화 뒤 다시 켠다). 1 = 빈 칸에 편집장 1순위 자동 게시
    slots: ["07:30", "12:30", "18:30"]       # 고정 게시 시간대(KST) — 고른 주제는 다음 빈 시간대부터 차례로 (사용자 결정 2026-09-12). 하루 3건이 상한
    max_per_day: 3                           # (slots 가 없을 때만) 24÷N 간격의 하루 상한
    reels: true                              # 소재에 영상(공식 유튜브·X·공식 페이지 mp4)이 있으면 카드 대신 릴스로 게시 (출처 표기)
    post_kind: reel                          # 말하는 대본 + 자막 릴스 (2026-09-14 사용자가 목소리 샘플 6개 중 '필재' 선택 → 켬). carousel 이면 카드뉴스
    reel_voice_engine: typecast              # typecast(타입캐스트, 키 TYPECAST_API_KEY) | edge(무료 엣지) | supertonic(오픈소스) | none(음악+자막만). 실패하면 엣지로 자동 대체
    reel_voice: tc_68257f68bc6e3c161ab5078d  # 타입캐스트 '필재'(남·중년, @to_be_100m 신비한 건축사전이 쓰는 목소리). 엣지면 ko-KR-SunHiNeural 등
    reel_tempo: 1.25                         # 말 빠르기 배수(타입캐스트 0.5~2.0). 1.1 → 1.25 (2026-09-14 사용자: 조금 빨라질 필요)
    reel_bgm: true                           # 코드로 만든 저작권 없는 배경음악
    next_run: "매일 06:30·11:30 후보 · 07:30 · 12:30 · 18:30 게시(비어 있으면 1순위 자동)"

  parent:                                    # 육아 꿀팁·혜택 (2026-09-14 추가) — 계정 개설·토큰 등록 전까지는 후보만 뽑고 게시는 건너뛴다
    profile: parent
    handle: "@babyhoney.kr"                  # 2026-09-15 사용자가 개설 (꿀팁 = honey tips). 성별 중립 이름
    dept: strategy2
    result_link: "https://www.instagram.com/"
    posts_per_run: 1
    candidates_to_llm: 40
    review_count: 20
    auto_pick: 0                             # 자동 게시 멈춤 (2026-09-15 사용자: 릴스 고도화 뒤 다시 켠다). 1 = 빈 칸에 편집장 1순위 자동 게시
    slots: ["07:30", "12:30", "18:30"]
    max_per_day: 3
    reels: true
    post_kind: carousel
    reel_voice_engine: typecast              # 릴스로 켤 때 목소리 (계정 개설 뒤 post_kind: reel)
    reel_voice: tc_68257f68bc6e3c161ab5078d  # 타입캐스트 '필재'
    next_run: "매일 06:30·11:30 후보 · 07:30 · 12:30 · 18:30 게시"
  benefit:                                   # 돈 되는 정책·혜택 알림 (2026-09-14 추가)
    profile: benefit
    handle: "@benefit.kr"
    dept: brand
    result_link: "https://www.instagram.com/"
    posts_per_run: 1
    candidates_to_llm: 40
    review_count: 20
    auto_pick: 0                             # 자동 게시 멈춤 (2026-09-15 사용자: 릴스 고도화 뒤 다시 켠다). 1 = 빈 칸에 편집장 1순위 자동 게시
    slots: ["07:30", "12:30", "18:30"]
    max_per_day: 3
    reels: true
    post_kind: carousel
    reel_voice_engine: typecast              # 릴스로 켤 때 목소리 (계정 개설 뒤 post_kind: reel)
    reel_voice: tc_68257f68bc6e3c161ab5078d  # 타입캐스트 '필재'
    next_run: "매일 06:30·11:30 후보 · 07:30 · 12:30 · 18:30 게시"

# 글 생성기: 앞에서부터 시도, 실패하면 다음 (전부 무료 경로)
llm_providers: [claude_cli, gemini]
gemini_model: gemini-2.5-flash

# 상태 보고: 저장소 루트(체크아웃 위치)에 커밋
office_repo: "."
office_workspace: "side"

# 화면의 직원(하위 작업) id. 원천은 app/workspaces/side.ts 의 automations[].tasks[] (테스트로 일치 강제)
tasks: [topic, write, card, upload]
