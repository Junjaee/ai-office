# 인스타 게시글 자동화 — GitHub Actions 실행용 설정. 비밀값은 여기 두지 않고 환경변수(GitHub Secrets)로 받는다.
# 코드는 플랫폼당 한 벌(이 폴더). 계정마다 아래 accounts 에 한 항목씩 더한다 (팀 = 플랫폼, 자동화 = 계정).

default_account: aitips

accounts:
  aitips:
    profile: aitips                          # profiles/<이름>.yaml
    handle: "@aitips.kr"                  # 카드에 찍히는 표시 (실제 인스타 사용자 이름)
    dept: research                           # 사무실 설정의 부서 id (인스타 게시글팀)
    result_link: "https://www.instagram.com/aitips.kr/"
    posts_per_run: 1                         # 실행 1회에 올릴 게시물 수
    candidates_to_llm: 40                    # 소재 후보를 몇 개까지 편집장(모델)에게 보여 줄지
    review_count: 20                         # 매일 검토 칸에 올릴 후보 수 (사용자 결정 2026-09-12: 최대 20)
    auto_pick: 1                             # 첫 시간대(07:30)에 예약이 없으면 편집장 1순위부터 이 개수만큼 자동 게시 (0 = 끔)
    slots: ["07:30", "12:30", "18:30"]       # 고정 게시 시간대(KST) — 고른 주제는 다음 빈 시간대부터 차례로 (사용자 결정 2026-09-12). 하루 3건이 상한
    max_per_day: 3                           # (slots 가 없을 때만) 24÷N 간격의 하루 상한
    reels: true                              # 소재에 영상(공식 유튜브·X·공식 페이지 mp4)이 있으면 카드 대신 릴스로 게시 (출처 표기)
    next_run: "매일 06:30 후보 · 07:30 · 12:30 · 18:30 게시(07:30 은 안 고르면 1순위 자동)"

# 글 생성기: 앞에서부터 시도, 실패하면 다음 (전부 무료 경로)
llm_providers: [claude_cli, gemini]
gemini_model: gemini-2.5-flash

# 상태 보고: 저장소 루트(체크아웃 위치)에 커밋
office_repo: "."
office_workspace: "side"

# 화면의 직원(하위 작업) id. 원천은 app/workspaces/side.ts 의 automations[].tasks[] (테스트로 일치 강제)
tasks: [topic, write, card, upload]
