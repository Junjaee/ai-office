# 주식 분석 점검표 문턱값 — 한 곳에서 고친다 (설계서 §5.1). 숫자를 바꾸면 화면 문장도 따라 바뀐다.
sector_min: 5            # 업종 안 종목이 이보다 적으면 시장 전체 중앙값과 견준다
checks:
  value:                 # 예상 PER ÷ 견줄 중앙값
    pass_below: 1.0
    warn_at: 1.5
  growth:                # 최근 분기 매출 증가율(%, 전년 대비)
    pass_at: 10
    care_at: 0
  earnings:              # 최근 분기 이익 증가율(%). care_floor 아래면 경고
    care_floor: -20
  debt:                  # 순부채 ÷ 연간 영업이익(EBITDA)
    pass_below: 2.0
    warn_at: 4.0
  trend:                 # 1년 최고가 대비 얼마나 아래인가(%)
    pass_within: 10
    care_within: 30
lenses:                  # 발굴 네 관점 (설계서 §5.2)
  growth:
    rev_at: 15           # 최근 분기 매출 증가율(%)이 이 이상이고 이익이 늘었을 때
  event:
    days: 14             # 최근 며칠 안의 공시를 볼지
    move_pct: 7          # 또는 하루 등락이 이 이상이면서
    dv1_at: 3.0          # 그날 거래대금이 60일 평균의 이 배 이상
    major: ["실적 발표", "인수·매각 완료", "주식 발행(자금 조달)", "재무제표 정정", "지배권 변경", "파산·회생", "상장 유지 경고", "구조조정"]
  flow:
    dv_at: 1.5           # 최근 5일 평균 거래대금 ÷ 60일 평균
