# 주식 분석 — GitHub Actions 실행용 설정. 비밀값은 여기 두지 않는다(환경변수 LIVE_TOKEN 은 선택).

# 자료를 보낼 사이트 (Worker /api/stock). 주소는 CLAUDE.md 에 이미 적혀 있는 것과 같다.
site_url: "https://ai-office.smartjohn-d34.workers.dev"

request_delay: 0.3      # 종목 사이 쉬는 시간(초)
filings_budget_sec: 480   # 공시(8-K) 확인에 쓸 수 있는 시간(초) — 넘으면 남은 종목은 가격 조건만 본다
news_enabled: true      # 관심 종목의 최근 기사 제목을 받는다(해석할 때 읽을 자료). false 면 아무것도 받지 않는다
max_fail_ratio: 0.2     # 받지 못한 종목이 이 비율을 넘으면 실패로 끝내고 지난 자료를 둔다

# 결과 화면은 카드의 "분석 화면" 단추(app/workspaces/home.ts page)가 맡는다 — 결과 폴더 단추는 두지 않는다
result_link: ""

# 상태 보고: 저장소 루트(체크아웃 위치)에 커밋 — 건수만 남긴다
office_repo: "."
office_workspace: "home"
next_run: "화~토 07:00"

# 화면의 직원(하위 작업) id. 원천은 app/workspaces/home.ts (테스트로 일치 강제)
tasks: [check, collect, discover]
