# 주식 신호 — GitHub Actions 실행용 설정. 비밀값은 여기 두지 않고 환경변수(GitHub Secrets)로 받는다.
#   TELEGRAM_BOT_TOKEN_JUNJAE_BOT / TELEGRAM_CHAT_ID_STOCK

# 규칙 (사용자 결정 2026-09-22, 근거 docs/stock/12-재무제표-팩터-검증.md)
top_n: 20                  # 상위 몇 종목
weight: "equal"            # equal(동일가중) 또는 invvol(역변동성)
observe_until: "2027-03-31"  # 이 날까지 알림에 "관찰 중" 표시 (첫 두 분기)

# 자료
price_period: "18mo"       # 시세 받는 기간 (200일선·1년 고점 계산에 충분)
max_fail_rate: 0.05        # 시세를 못 받은 종목이 이 비율을 넘으면 그날은 신호를 내지 않는다
min_candidates: 300        # 점수를 매길 수 있는 종목이 이보다 적으면 분기 알림을 내지 않는다
facts_cache: ""            # companyfacts.zip 둘 곳 (비우면 임시 폴더; 3일 안 받은 것은 다시 쓴다)
sec_user_agent: "ai-office stock automation ai-office-bot@users.noreply.github.com"   # SEC 는 이름+메일 형식을 요구. 저장소 봇 주소(개인 메일 아님)
local_secrets: "ai-home/02_주식신호/config.yaml"   # 이 PC 시험용 비밀값 파일 (gitignore). 서버에는 없다
retries: 3
timeout: 30

# 결과물 위치 (있으면 카드에 "결과 폴더 열기" 버튼)
result_link: ""

# 상태 보고: 저장소 루트(체크아웃 위치)에 커밋
office_repo: "."
office_workspace: "home"   # 상태 파일을 쓸 사무실 (public/status/<id>/)
next_run: "매일 06:30"     # 카드에 보일 다음 실행 문구

# 화면의 직원(하위 작업) id. 원천은 app/workspaces/home.ts 의 automations[].tasks[] (테스트로 일치 강제)
tasks: [quotes, scan, notify]
